{% extends "base.html" %}{% block body %}
{% if lane == 'ready' and cards %}
<form method="post" action="/approve-all" onsubmit="return confirm('Submit all {{cards|length}} visible applications, one by one?')">
  <input type="hidden" name="csrf" value="{{csrf}}"><input type="hidden" name="ids" value="{{ cards|map(attribute='app')|map(attribute='id')|join(',') }}">
  <div class="actions" style="margin:0 0 14px"><button>Approve all visible ({{cards|length}})</button></div></form>
{% endif %}
{% for c in cards %}{% include "_card.html" %}{% else %}<div class="empty">Nothing in {{lane_titles[lane]}}.</div>{% endfor %}
{% endblock %}
